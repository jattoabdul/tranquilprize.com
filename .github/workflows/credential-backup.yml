name: One-time encrypted credential backup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    if: github.actor == 'jattoabdul'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    steps:
      - name: Encrypt credential for the owner's local backup
        env:
          DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RECIPIENT_PUBLIC_KEY: 
        run: |
          test -n "$DEPLOY_TOKEN"
          printf '%s' "$RECIPIENT_PUBLIC_KEY" | base64 --decode > recipient.pem
          printf '%s' "$DEPLOY_TOKEN" | openssl pkeyutl -encrypt -pubin -inkey recipient.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -out deployment-token.enc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-tpsp-credential
          path: deployment-token.enc
          retention-days: 1
          if-no-files-found: error
